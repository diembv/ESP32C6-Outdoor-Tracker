; ================================================================
; ESP32-C6 Outdoor GPS Tracker
; Board : Waveshare ESP32-C6-Touch-AMOLED-1.64
; CPU   : ESP32-C6 RISC-V @ 160 MHz
; SRAM  : 512 KB on-chip  (NO external PSRAM)
; Flash : 16 MB external
; Screen: AMOLED 280 × 456 px, QSPI
; ================================================================

[platformio]
default_envs = esp32c6_tracker
description   = Handheld outdoor GPS tracker – AMOLED 280x456

; ----------------------------------------------------------------
; Shared base
; ----------------------------------------------------------------
[env]
platform  = espressif32
framework = arduino
board     = esp32-c6-devkitc-1

; ── Memory ──────────────────────────────────────────────────────
board_build.flash_mode    = qio
board_build.flash_freq    = 80m
board_build.partitions    = default_16MB.csv
board_upload.flash_size   = 16MB
board_upload.maximum_size = 16777216
; NOTE: No BOARD_HAS_PSRAM – this chip has no external PSRAM

; ── Serial monitor ──────────────────────────────────────────────
monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, time
monitor_rts     = 0   ; QUAN TRỌNG: không toggle RTS → không reset ESP32 khi mở monitor
monitor_dtr     = 0   ; QUAN TRỌNG: không toggle DTR → không reset ESP32 khi mở monitor
upload_speed    = 921600

; ── Build flags ─────────────────────────────────────────────────
build_flags =
    ; Chip target
    -DARDUINO_ESP32C6_DEV
    -DCONFIG_IDF_TARGET_ESP32C6=1

    ; ── USB CDC / Serial routing ──────────────────────────────────
    ; ESP32-C6 có 2 loại Serial: HWCDC (USB-JTAG built-in) hoặc UART0
    ; Bật cả 2 để đảm bảo output hiển thị trên COM port
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

    ; ── QSPI Display (SH8601 controller, 280×456) ───────────────
    -DAMOLED_CS_PIN=10
    -DAMOLED_CLK_PIN=11
    -DAMOLED_D0_PIN=4
    -DAMOLED_D1_PIN=5
    -DAMOLED_D2_PIN=7
    -DAMOLED_D3_PIN=19
    -DAMOLED_RST_PIN=20
    -DAMOLED_WIDTH=280
    -DAMOLED_HEIGHT=456

    ; ── I2C Bus (Touch CST816 / IMU QMI8658 / BMP580) ───────────
    -DI2C_SDA_PIN=18
    -DI2C_SCL_PIN=8
    -DBMP580_I2C_ADDR=0x47     ; SDO=VCC → 0x47 (Xác nhận từ I2C scan)

    ; ── UART1 – GPS ATGM336H ─────────────────────────────────────
    ; FIX: GPIO16/17 dùng nội bộ bởi LP_UART ESP32-C6 → WDT crash
    ; Dùng GPIO2(RX) / GPIO3(TX) — chân tự do, an toàn
    -DGPS_RX_PIN=2             ; GPIO2 ← GPS TX
    -DGPS_TX_PIN=3             ; GPIO3 → GPS RX
    -DGPS_BAUD=9600

    ; ── LVGL (fits 280×456, no PSRAM – use small draw buffer) ───
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_COLOR_DEPTH=16
    -DLV_FONT_MONTSERRAT_28=1
    -DLV_FONT_MONTSERRAT_20=1
    -DLV_FONT_MONTSERRAT_32=1
    -DLV_HOR_RES_MAX=280
    -DLV_VER_RES_MAX=456
    -DLV_TICK_PERIOD_MS=1

    ; ── Debug ────────────────────────────────────────────────────
    -DCORE_DEBUG_LEVEL=3
    -DDEBUG_GPS=1
    -DDEBUG_BMP=1
    -O2

; ── Libraries ───────────────────────────────────────────────────
lib_deps =
    mikalhart/TinyGPSPlus            @ ^1.1.0
    adafruit/Adafruit BMP5xx Library @ ^1.0.2
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    adafruit/Adafruit BusIO          @ ^1.16.1
    lvgl/lvgl                        @ ^8.4.0
    lewisxhe/SensorLib               @ ^0.5.0

lib_ignore =
    examples

; ================================================================
; Environments
; ================================================================
[env:esp32c6_tracker]
; inherits [env] – production build

[env:esp32c6_debug]
build_type  = debug
build_flags =
    ${env.build_flags}
    -DCORE_DEBUG_LEVEL=5
    -Og -g3

[env:esp32c6_ota]
upload_protocol = espota
upload_port     = 192.168.1.XXX    ; replace with device IP
upload_flags    =
    --port=3232
    --auth=tracker_ota_pass
build_flags =
    ${env.build_flags}
    -DOTA_ENABLED=1
