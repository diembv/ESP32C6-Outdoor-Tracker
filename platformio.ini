; ================================================================
; ESP32 Multi-Board Outdoor GPS Tracker
; Supports:
;   - Waveshare ESP32-C6-Touch-AMOLED-1.64  (280x456 Portrait, No PSRAM)
;   - Waveshare ESP32-S3-Touch-AMOLED-1.75C (466x466 Round, 8MB PSRAM)
;   - Waveshare ESP32-S3-Touch-AMOLED-1.8   (368x448 Portrait, 8MB PSRAM)
;   - Waveshare ESP32-S3-Touch-AMOLED-2.06  (410x502 Portrait, 8MB PSRAM, 32MB Flash)
;   - Waveshare ESP32-S3-Touch-AMOLED-2.16  (480x480 Square, 8MB PSRAM)
;   - Waveshare ESP32-S3-Touch-AMOLED-2.41  (600x450 Landscape, 8MB PSRAM)
; ================================================================

[platformio]
default_envs = esp32c6_tracker
description  = Multi-Board Outdoor GPS Tracker (ESP32-C6 & ESP32-S3 AMOLED)

; ----------------------------------------------------------------
; Shared Base Configuration
; ----------------------------------------------------------------
[env_common_base]
platform        = espressif32
framework       = arduino
monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, time
monitor_rts     = 0
monitor_dtr     = 0
upload_speed    = 921600

build_flags =
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_COLOR_DEPTH=16
    -DLV_FONT_MONTSERRAT_12=1
    -DLV_FONT_MONTSERRAT_14=1
    -DLV_FONT_MONTSERRAT_20=1
    -DLV_FONT_MONTSERRAT_28=1
    -DLV_FONT_MONTSERRAT_32=1
    -DLV_USE_MSGBOX=1
    -DLV_TICK_PERIOD_MS=1
    -I include
    -I src
    -DCORE_DEBUG_LEVEL=0
    -DDEBUG_GPS=1
    -DDEBUG_BMP=1
    -O2

lib_deps =
    mikalhart/TinyGPSPlus            @ ^1.1.0
    adafruit/Adafruit BMP5xx Library @ ^1.0.2
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    adafruit/Adafruit BusIO          @ ^1.16.1
    lvgl/lvgl                        @ ^8.4.0
    h2zero/NimBLE-Arduino            @ ^2.1.0

lib_ignore =
    examples

; ----------------------------------------------------------------
; ESP32-C6 Common (512KB SRAM, No PSRAM)
; ----------------------------------------------------------------
[env_common_esp32c6]
extends                   = env_common_base
board                     = esp32-c6-devkitc-1
board_build.flash_mode    = qio
board_build.flash_freq    = 80m
board_build.partitions    = default_16MB.csv
board_upload.flash_size   = 16MB
board_upload.maximum_size = 16777216
build_flags =
    ${env_common_base.build_flags}
    -DARDUINO_ESP32C6_DEV
    -DCONFIG_IDF_TARGET_ESP32C6=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

; ----------------------------------------------------------------
; ESP32-S3R8 Common (8MB Octal PSRAM)
; ----------------------------------------------------------------
[env_common_esp32s3_psram]
extends                         = env_common_base
board                           = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_mode          = qio
board_build.flash_freq          = 80m
board_build.psram_type          = opi
board_build.partitions          = default_16MB.csv
board_upload.flash_size         = 16MB
board_upload.maximum_size       = 16777216
build_flags =
    ${env_common_base.build_flags}
    -DBOARD_HAS_PSRAM=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DLV_FONT_MONTSERRAT_36=1

; ================================================================
; 6 Target Board Environments
; ================================================================

[env:ws_c6_amoled_164]
extends     = env_common_esp32c6
build_flags =
    ${env_common_esp32c6.build_flags}
    -DBOARD_WS_C6_AMOLED_164=1

[env:ws_s3_amoled_175c]
extends     = env_common_esp32s3_psram
build_flags =
    ${env_common_esp32s3_psram.build_flags}
    -DBOARD_WS_S3_AMOLED_175C=1

[env:ws_s3_amoled_180]
extends     = env_common_esp32s3_psram
build_flags =
    ${env_common_esp32s3_psram.build_flags}
    -DBOARD_WS_S3_AMOLED_180=1

[env:ws_s3_amoled_206]
extends                   = env_common_esp32s3_psram
board_build.partitions    = default_16MB.csv
board_upload.flash_size   = 32MB
board_upload.maximum_size = 33554432
build_flags =
    ${env_common_esp32s3_psram.build_flags}
    -DBOARD_WS_S3_AMOLED_206=1

[env:ws_s3_amoled_216]
extends     = env_common_esp32s3_psram
build_flags =
    ${env_common_esp32s3_psram.build_flags}
    -DBOARD_WS_S3_AMOLED_216=1

[env:ws_s3_amoled_241]
extends     = env_common_esp32s3_psram
build_flags =
    ${env_common_esp32s3_psram.build_flags}
    -DBOARD_WS_S3_AMOLED_241=1

; ================================================================
; Legacy / Utility Environments (Backward Compatibility)
; ================================================================

[env:esp32c6_tracker]
extends     = env:ws_c6_amoled_164

[env:esp32c6_debug]
extends     = env:ws_c6_amoled_164
build_type  = debug
build_flags =
    ${env:ws_c6_amoled_164.build_flags}
    -DCORE_DEBUG_LEVEL=5
    -Og -g3

[env:esp32c6_ota]
extends         = env:ws_c6_amoled_164
upload_protocol = espota
upload_port     = 192.168.1.XXX
upload_flags    =
    --port=3232
    --auth=tracker_ota_pass
build_flags =
    ${env:ws_c6_amoled_164.build_flags}
    -DOTA_ENABLED=1
